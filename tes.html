<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/tes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body>
    <div>
        <form action="login.html" method="get" class="form">
            <input type="text" name="name" placeholder="Enter your name" class="input"> <br>
            <input type="password" name="password" placeholder="Enter your password" class="input"> <br>
            <input type="email" name="subject" placeholder="Enter your subject" class="input"> <br>
            <input type="date" name="message" placeholder="Enter your message" class="input"> <br>
            <input type="time" name="time" class="input"> Remember me <br>
            <input type="checkbox" name="remember" class="input">christiano </input> <br>
            <input type="radio" name="gender" value="male" class="input"> Male
            <input type="radio" name="gender" value="female" class="input"> Female
            <select name="other" class="input">
                <option value="IF">Informasi</option>
                <option value="RKS">Ruang Kelas</option>
                <option value="GEO">Geografi</option>
                <option value="MB">Matematika dan Bilangan</option>
            </select>
            <button type="submit" class="button">Submit</button>
            <button type="reset" class="button kamu">Reset</button>
            <button type="cancel" class="animate__animated animate__bounce   button">Cancel</button>
        </form>
    </div>
    <fieldset>
        <legend>Additional Information</legend>
        <p>Please provide any additional information or comments here:</p>
        <textarea class="input" rows="4"></textarea>
    </fieldset>
</body>
</html>
