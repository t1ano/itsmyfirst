
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - My Website</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-6">

    <!-- Login Container -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">
                Welcome Back
            </h1>

            <p class="text-slate-500 mt-2">
                Silakan login ke akun Anda.
            </p>
        </div>

        <!-- Login Form -->
        <form action="dashboard.html" method="post" class="space-y-5">

            <!-- Username -->
            <div>
                <label
                    for="username"
                    class="block text-sm font-medium text-slate-700 mb-2"
                >
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Masukkan username Anda"
                    required
                    autocomplete="username"
                    class="w-full px-4 py-3 border border-slate-300
                    rounded-lg outline-none transition
                    focus:ring-2 focus:ring-blue-500
                    focus:border-blue-500"
                >
            </div>

            <!-- Password -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label
                        for="password"
                        class="block text-sm font-medium text-slate-700"
                    >
                        Password
                    </label>

                    <a
                        href="forgot-password.html"
                        class="text-sm text-blue-600 hover:underline"
                    >
                        Lupa password?
                    </a>
                </div>

                <div class="flex gap-2">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Masukkan password Anda"
                        required
                        autocomplete="current-password"
                        class="flex-1 min-w-0 px-4 py-3 border
                        border-slate-300 rounded-lg outline-none
                        transition focus:ring-2 focus:ring-blue-500
                        focus:border-blue-500"
                    >

                    <button
                        type="button"
                        id="viewpass"
                        class="px-4 py-3 bg-slate-200 text-slate-700
                        rounded-lg hover:bg-slate-300 transition"
                    >
                        Lihat
                    </button>
                </div>
            </div>

            <!-- Remember Me -->
            <div class="flex items-center gap-2">
                <input
                    type="checkbox"
                    id="remember"
                    name="remember"
                    class="w-4 h-4 accent-blue-600"
                >

                <label
                    for="remember"
                    class="text-sm text-slate-600"
                >
                    Ingat saya
                </label>
            </div>

            <!-- Login Button -->
            <button
                type="submit"
                class="w-full py-3 bg-blue-600 text-white
                font-semibold rounded-lg hover:bg-blue-700
                active:bg-blue-800 transition duration-200"
            >
                Login
            </button>

        </form>

        <!-- Register Link -->
        <p class="text-center text-sm text-slate-500 mt-6">
            Belum memiliki akun?

            <a
                href="register.html"
                class="text-blue-600 font-medium hover:underline"
            >
                Daftar sekarang
            </a>
        </p>

    </div>

    <!-- JavaScript Password Toggle -->
    <script>
        const password = document.getElementById("password");
        const viewpass = document.getElementById("viewpass");

        viewpass.addEventListener("click", () => {
            if (password.type === "password") {
                password.type = "text";
                viewpass.textContent = "Sembunyikan";
            } else {
                password.type = "password";
                viewpass.textContent = "Lihat";
            }
        });
    </script>

</body>
</html>
