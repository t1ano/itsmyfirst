
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-6">

    <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl p-8">

        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">
                Create Account
            </h1>

            <p class="text-slate-500 mt-2">
                Silakan isi data untuk membuat akun baru.
            </p>
        </div>

        <!-- Register Form -->
        <form action="dashboard.html" method="post" class="space-y-5">

            <!-- Username -->
            <div>
                <label for="username"
                    class="block text-sm font-medium text-slate-700 mb-2">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Masukkan username Anda"
                    required
                    minlength="3"
                    class="w-full px-4 py-3 border border-slate-300 rounded-lg
                    outline-none transition
                    focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                >
            </div>

            <!-- Password -->
            <div>
                <label for="password"
                    class="block text-sm font-medium text-slate-700 mb-2">
                    Password
                </label>

                <div class="flex gap-2">
                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Masukkan password Anda"
                        required
                        minlength="8"
                        class="flex-1 min-w-0 px-4 py-3 border border-slate-300
                        rounded-lg outline-none transition
                        focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    >

                    <button
                        type="button"
                        id="viewpass"
                        class="px-4 py-3 bg-slate-200 text-slate-700
                        rounded-lg hover:bg-slate-300 transition"
                    >
                        Lihat
                    </button>
                </div>
            </div>

            <!-- Nama Lengkap -->
            <div>
                <label for="name"
                    class="block text-sm font-medium text-slate-700 mb-2">
                    Nama Lengkap
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Masukkan nama lengkap Anda"
                    required
                    class="w-full px-4 py-3 border border-slate-300 rounded-lg
                    outline-none transition
                    focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                >
            </div>

            <!-- Tanggal Lahir -->
            <div>
                <label for="born"
                    class="block text-sm font-medium text-slate-700 mb-2">
                    Tanggal Lahir
                </label>

                <input
                    type="date"
                    id="born"
                    name="born"
                    required
                    class="w-full px-4 py-3 border border-slate-300 rounded-lg
                    outline-none transition
                    focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                >
            </div>

            <!-- Alamat -->
            <div>
                <label for="address"
                    class="block text-sm font-medium text-slate-700 mb-2">
                    Alamat
                </label>

                <input
                    type="text"
                    id="address"
                    name="address"
                    placeholder="Masukkan alamat tempat tinggal"
                    required
                    class="w-full px-4 py-3 border border-slate-300 rounded-lg
                    outline-none transition
                    focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                >
            </div>

            <!-- Nomor Telepon -->
            <div>
                <label for="nomortelepon"
                    class="block text-sm font-medium text-slate-700 mb-2">
                    Nomor Telepon
                </label>

                <input
                    type="tel"
                    id="nomortelepon"
                    name="nomortelepon"
                    placeholder="+62......."
                    required
                    minlength="9"
                    class="w-full px-4 py-3 border border-slate-300 rounded-lg
                    outline-none transition
                    focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                >
            </div>

            <!-- Submit -->
            <button
                type="submit"
                class="w-full py-3 bg-blue-600 text-white font-semibold
                rounded-lg hover:bg-blue-700 active:bg-blue-800
                transition duration-200"
            >
                Daftar Sekarang
            </button>

        </form>

        <!-- Footer -->
        <p class="text-center text-sm text-slate-500 mt-6">
            Sudah memiliki akun?
            <a href="index.html"
                class="text-blue-600 font-medium hover:underline">
                Login di sini
            </a>
        </p>

    </div>

    <!-- JavaScript untuk melihat password -->
    <script src="register.js"></script>

</body>
</html>
