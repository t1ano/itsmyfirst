<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Add Produk</title>
</head>

<body class="min-h-screen flex flex-col">

    <!-- NAVBAR -->
    <nav class="bg-blue-600 flex items-center justify-between px-6 py-4">
        <h1 class="text-white font-bold text-2xl">
            Belanja
        </h1>

        <a href="" class="text-white border border-white px-4 py-2 rounded-lg">
            Logout
        </a>
    </nav>

    <div class="grid grid-cols-5 flex-1">

        <aside class="col-span-1 p-4 border-r border-gray-200">

            <a href="Dashboard.html"
                class="block w-full px-4 py-2">
                Dashboard
            </a>

            <a href="Products.html"
                class="block bg-blue-500 text-white w-full px-4 py-2 rounded-lg">
                Products
            </a>

            <a href=""
                class="block w-full px-4 py-2">
                Users
            </a>

            <a href=""
                class="block w-full px-4 py-2">
                Settings
            </a>

        </aside>


        <!-- MAIN -->
        <main class="col-span-4 min-w-0 p-8">

            <h1 class="text-3xl font-bold text-gray-700">
                Add Produk
            </h1>

            <form class="mt-8">

                <!-- NAME -->
                <div class="mb-4">

                    <label class="block text-gray-700 mb-2">
                        Name
                    </label>

                    <input
                        type="text"
                        class="w-full border border-gray-300 rounded-lg px-4 py-2">

                </div>


                <!-- STOCK -->
                <div class="mb-4">

                    <label class="block text-gray-700 mb-2">
                        Stock
                    </label>

                    <input
                        type="number"
                        class="w-full border border-gray-300 rounded-lg px-4 py-2">

                </div>


                <!-- DESCRIPTION -->
                <div class="mb-4">

                    <label class="block text-gray-700 mb-2">
                        Description
                    </label>

                    <textarea
                        rows="5"
                        class="w-full border border-gray-300 rounded-lg px-4 py-2"></textarea>

                </div>

                
                <button
                    type="submit"
                    class="bg-blue-500 text-white px-4 py-2 rounded-lg">
                    Submit
                </button>

            </form>

        </main>

    </div>

    <footer class="bg-black text-white text-center py-4">
        <p>© 2026 belajartailwind.com All rights reserved</p>
    </footer>

</body>

</html>
